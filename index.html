<style>
:root{
  --bg:#0c0b0a;--bg2:#161412;--bg3:#1e1b18;--ink:#f6f5f4;--mute:#b0aaa1;
  --line:rgba(246,245,244,.14);--line2:rgba(246,245,244,.08);
  --coral:#de6262;--amber:#e8a048;--gold:#f1b76f;--cream:#f5f3f0;--inkd:#181613;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gutter:clamp(16px,4vw,48px);--max:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img,video,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--amber);color:#181613}
.wrap{width:min(var(--max),100% - 2*var(--gutter));margin-inline:auto}
.ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3{font-weight:700;letter-spacing:-.035em;line-height:1.05}
h2{font-size:clamp(30px,4.2vw,52px)}
.hl{color:var(--amber)}
.sec{padding:clamp(44px,5.5vw,76px) 0;position:relative}
.sec-h{text-align:center;max-width:760px;margin:0 auto clamp(32px,4vw,52px)}
.sec-h p{color:var(--mute);margin-top:14px;font-size:clamp(17px,1.4vw,20px)}
/* secciones sobre crema */
.cream{--bg:var(--cream);--bg2:#fff;--bg3:#ece8e2;--ink:#181613;--mute:#514c46;--line:rgba(24,22,19,.16);--line2:rgba(24,22,19,.1);background:var(--cream);color:var(--ink)}
.cream .hl{color:#c27a1c}
.amberbg{background:var(--amber);color:#181613}
/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 28px;border-radius:999px;font-weight:600;font-size:16px;letter-spacing:-.01em;transition:transform .25s,background .25s,box-shadow .25s;white-space:nowrap}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn-go{background:var(--amber);color:#181613;box-shadow:0 10px 36px -10px rgba(232,160,72,.7)}
.btn-go:hover{transform:translateY(-2px);background:#f1b76f}
.btn-ink{background:#181613;color:#f6f5f4}
.btn-ink:hover{transform:translateY(-2px);background:#000}
.btn-ghost{border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{background:rgba(246,245,244,.08)}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:clamp(26px,3vw,40px)}
/* cabecera */
.topbar{background:var(--amber);color:#181613;text-align:center;font-size:14px;font-weight:500;padding:9px var(--gutter)}
.hdr{position:sticky;top:0;z-index:50;background:rgba(12,11,10,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line2)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.04em;font-size:21px}
.logo span{white-space:nowrap}.logo svg{width:28px;height:28px;flex:none}.logo b{color:var(--coral)}
.nav{display:none;gap:26px;font-size:14.5px;color:var(--mute)}
.nav a:hover{color:var(--ink)}
@media(min-width:900px){.nav{display:flex}}
.hdr-r{display:flex;align-items:center;gap:10px}
.lang{font-size:12px;letter-spacing:.08em;border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--mute)}
.hdr .btn{padding:11px 20px;font-size:14px}
@media(max-width:480px){.hdr .btn{padding:10px 12px;font-size:12.5px}.logo{font-size:17px}.logo svg{width:24px;height:24px}.hdr .wrap{gap:8px}.lang{padding:6px 9px}.topbar{font-size:12.5px;padding:7px var(--gutter)}}
/* hero */
.hero{position:relative;padding:clamp(40px,5vw,64px) 0 clamp(56px,7vw,96px);text-align:center;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0}
.hero::before{width:620px;height:620px;left:-160px;top:-120px;background:rgba(232,160,72,.22);animation:drift 14s ease-in-out infinite alternate}
.hero::after{width:520px;height:520px;right:-140px;top:120px;background:rgba(222,98,98,.16);animation:drift 18s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(60px,40px) scale(1.12)}}
.hero .wrap{position:relative;z-index:1}
.chip{display:inline-flex;align-items:center;gap:12px;padding:8px 18px 8px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(22,20,18,.7);font-size:14px;color:var(--mute)}
.chip .stack{display:flex}
.chip .stack img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid var(--bg);margin-left:-8px}
.chip .stack img:first-child{margin-left:0}
.hero h1{font-size:clamp(34px,5.4vw,68px);max-width:20ch;margin:22px auto 18px}
.hero .sub{font-size:clamp(18px,1.7vw,22px);max-width:40ch;margin:0 auto;color:var(--ink)}
.micro{margin-top:16px;font-size:14.5px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center}
.micro span::before{content:"✓";color:var(--amber);margin-right:8px;font-weight:700}
.fade{opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s ease}
.fade.in{opacity:1;transform:none}
/* panel de ejemplo */
.dash{position:relative;max-width:980px;margin:clamp(36px,4vw,56px) auto 0;text-align:left;border:1px solid var(--line);border-radius:22px;background:#13110f;overflow:hidden;box-shadow:0 50px 120px -50px rgba(232,160,72,.35)}
.dash-top{display:flex;align-items:center;gap:8px;padding:13px 18px;border-bottom:1px solid var(--line2);font-size:13px;color:var(--mute)}
.dash-top i{width:10px;height:10px;border-radius:50%;background:#3a3633}.dash-top i:first-child{background:var(--coral)}
.dash-top b{margin-left:8px;color:var(--ink);font-weight:500}
.dash-top em{margin-left:auto;font-style:normal;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11px}
.dash-body{display:grid;gap:18px;padding:20px}
@media(min-width:860px){.dash-body{grid-template-columns:.8fr 1.1fr 1.3fr;align-items:stretch}}
.d-card{border:1px solid var(--line2);border-radius:16px;background:#1a1816;padding:18px}
.d-card small{display:block;font-size:12px;color:var(--mute);margin-bottom:10px}
.d-num{font-size:clamp(54px,6vw,76px);font-weight:700;letter-spacing:-.05em;line-height:1;color:var(--ink)}
.d-delta{display:inline-block;margin-top:10px;font-size:13px;color:#7bd88f;background:rgba(123,216,143,.12);border-radius:999px;padding:3px 10px}
.bars{display:flex;align-items:flex-end;gap:9px;height:128px}
.bars i{flex:1;border-radius:7px 7px 3px 3px;background:var(--amber);height:0;transition:height 1s cubic-bezier(.2,.8,.2,1)}
.in .bars i{height:var(--h)}
.bars-l{display:flex;gap:9px;margin-top:8px;font-size:11px;color:var(--mute)}.bars-l span{flex:1;text-align:center}
.rows{display:grid;gap:11px}
.row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.2fr) 22px;gap:10px;align-items:center;font-size:13px;color:var(--mute)}
.row .bar{height:8px;background:#2b2825;border-radius:8px;overflow:hidden}
.row .bar i{display:block;height:100%;width:0;background:var(--coral);border-radius:8px;transition:width 1.2s cubic-bezier(.2,.8,.2,1) .3s}
.in .row .bar i{width:var(--w)}
.row b{color:var(--ink);text-align:right}
.toasts{position:absolute;right:18px;bottom:16px;width:min(280px,calc(100% - 36px));height:48px;pointer-events:none}
.toast{position:absolute;inset:0;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:14px;background:#fff;color:#181613;font-size:13.5px;font-weight:500;box-shadow:0 18px 40px -16px rgba(0,0,0,.7);opacity:0;transform:translateY(14px);animation:toast 9s infinite}
.toast:nth-child(2){animation-delay:3s}.toast:nth-child(3){animation-delay:6s}
.toast .dot{width:9px;height:9px;border-radius:50%;background:#2fb457;flex:none}
@keyframes toast{0%{opacity:0;transform:translateY(14px)}6%,28%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-10px)}}
@media(max-width:859px){.toasts{position:relative;right:auto;bottom:auto;margin:0 20px 18px;width:auto}}
/* prueba */
.proof .nums{display:grid;gap:14px;max-width:960px;margin:0 auto}
@media(min-width:760px){.proof .nums{grid-template-columns:repeat(3,1fr)}}
.num-c{background:var(--bg2);border:1px solid var(--line2);border-radius:22px;padding:28px 24px;text-align:center}
.num-c b{display:block;font-size:clamp(40px,5vw,60px);font-weight:700;letter-spacing:-.05em;line-height:1;color:#181613}
.num-c span{display:block;margin-top:10px;color:var(--mute);font-size:16px}
.proof .note{text-align:center;color:var(--mute);margin-top:18px;font-size:15.5px}
.faces{display:flex;flex-wrap:wrap;gap:12px 22px;justify-content:center;margin:34px auto 0;max-width:900px}
.face{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--mute)}
.face img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.marquee{margin-top:38px;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.marquee .track{display:flex;gap:14px;width:max-content;animation:marq 48s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.marquee img{height:clamp(190px,22vw,270px);width:auto;border-radius:16px;border:1px solid var(--line2)}
@keyframes marq{to{transform:translateX(calc(-50% - 7px))}}
/* dolores */
.pains{display:grid;gap:14px;max-width:1000px;margin:0 auto}
@media(min-width:860px){.pains{grid-template-columns:repeat(3,1fr)}}
.pain{background:var(--bg2);border:1px solid var(--line2);border-radius:22px;padding:28px 26px;display:grid;gap:12px;align-content:start}
.pain .ic{width:54px;height:54px;border-radius:16px;background:rgba(222,98,98,.14);color:var(--coral);display:grid;place-items:center;font-size:26px}
.pain .ic svg{animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.14)}}
.pain h3{font-size:clamp(22px,2vw,26px)}
.pain p{color:var(--mute);font-size:16px}
/* cómo funciona */
.pipe{display:grid;gap:18px;max-width:1040px;margin:0 auto clamp(36px,4vw,52px)}
@media(min-width:860px){.pipe{grid-template-columns:repeat(4,1fr);gap:0}}
.pn{position:relative;text-align:center;padding:0 10px}
.pn .c{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;background:#181613;color:var(--amber);display:grid;place-items:center;font-size:32px;position:relative;z-index:1}
.pn.last .c{background:var(--amber);color:#181613}
.pn b{display:block;font-size:16.5px;font-weight:600;letter-spacing:-.02em}
.pn small{display:block;color:var(--mute);font-size:14px;margin-top:4px}
@media(min-width:860px){.pn:not(:last-child)::after{content:"";position:absolute;top:37px;left:calc(50% + 40px);width:calc(100% - 80px);border-top:2px dashed rgba(24,22,19,.28)}
.pn:not(:last-child)::before{content:"";position:absolute;top:32px;left:calc(50% + 40px);width:10px;height:10px;border-radius:50%;background:var(--coral);z-index:2;animation:flow 2.8s linear infinite}
.pn:nth-child(2)::before{animation-delay:.9s}.pn:nth-child(3)::before{animation-delay:1.8s}}
@keyframes flow{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(calc(100% * 0 + 150px));opacity:0}}
.steps{display:grid;gap:14px;max-width:1040px;margin:0 auto}
@media(min-width:860px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{background:var(--bg2);border:1px solid var(--line2);border-radius:22px;padding:26px;display:grid;gap:8px}
.step em{font-style:normal;font-weight:700;font-size:15px;color:#c27a1c}
.step h3{font-size:clamp(21px,1.9vw,25px)}
.step p{color:var(--mute);font-size:16px}
/* cerebro */
.brain{display:grid;gap:clamp(18px,3vw,32px);max-width:1080px;margin:0 auto}
@media(min-width:900px){.brain{grid-template-columns:1fr 1fr;align-items:stretch}}
.panel{background:var(--bg2);border:1px solid var(--line2);border-radius:24px;padding:clamp(22px,3vw,34px)}
.panel h3{font-size:clamp(22px,2.2vw,28px);margin-bottom:8px}
.panel>p{color:var(--mute);font-size:16px}
.cer-map{position:relative;height:230px;margin-top:20px}
.cer-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:112px;height:112px;border-radius:50%;background:var(--amber);color:#181613;display:grid;place-items:center;text-align:center;font-weight:700;font-size:14px;line-height:1.15;z-index:2}
.cer-core::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(232,160,72,.5);animation:ring 2.6s ease-out infinite}
@keyframes ring{from{transform:scale(.86);opacity:1}to{transform:scale(1.35);opacity:0}}
.cer-chip{position:absolute;padding:7px 13px;border-radius:999px;background:#241f1b;border:1px solid var(--line);font-size:13.5px;white-space:nowrap;animation:bob 5s ease-in-out infinite alternate}
.cer-chip:nth-child(2){left:0;top:6%}.cer-chip:nth-child(3){right:0;top:12%;animation-delay:-1s}
.cer-chip:nth-child(4){left:2%;bottom:8%;animation-delay:-2s}.cer-chip:nth-child(5){right:3%;bottom:6%;animation-delay:-3s}
.cer-chip:nth-child(6){left:50%;top:-2%;margin-left:-52px;animation-delay:-1.5s}
@keyframes bob{to{transform:translateY(-7px)}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:20px}
.cal .d{aspect-ratio:1;border-radius:9px;background:#2a2522;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;opacity:0;transform:scale(.7);transition:opacity .35s,transform .35s;transition-delay:calc(var(--i)*28ms)}
.in .cal .d{opacity:1;transform:none}
.cal .d b,.cal .d u{width:8px;height:8px;border-radius:50%;display:block}
.cal .d b{background:var(--coral)}.cal .d u{background:var(--amber)}
.legend{display:flex;gap:18px;margin-top:14px;font-size:13.5px;color:var(--mute)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.legend .a::before{background:var(--coral)}.legend .c::before{background:var(--amber)}
.cal-cap{margin-top:12px;font-weight:600;font-size:17px;letter-spacing:-.02em}
/* garantía */
.gar{display:grid;gap:30px;align-items:center;max-width:1000px;margin:0 auto}
@media(min-width:860px){.gar{grid-template-columns:auto 1fr;gap:56px}}
.ringbox{position:relative;width:190px;height:190px;margin:0 auto}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox .tr{fill:none;stroke:rgba(24,22,19,.16);stroke-width:12}
.ringbox .pr{fill:none;stroke:#181613;stroke-width:12;stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset 1.8s cubic-bezier(.2,.8,.2,1)}
.in .ringbox .pr{stroke-dashoffset:0}
.ringbox div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringbox b{font-size:62px;font-weight:700;letter-spacing:-.06em;line-height:1}
.ringbox span{font-size:15px;font-weight:500}
.gar h2{font-size:clamp(28px,3.4vw,42px)}
.gar p{margin-top:12px;font-size:clamp(17px,1.4vw,19px);line-height:1.5}
.gar .def{font-size:15.5px;opacity:.82}
.gar .btn{margin-top:22px}
/* trabajo */
.pieces{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;max-width:1080px;margin:0 auto}
.pieces .work{flex:0 0 min(250px,68vw);scroll-snap-align:start}
@media(min-width:900px){.pieces{justify-content:center;overflow:visible}.pieces .work{flex:1 1 0}}
.work{position:relative;border-radius:20px;overflow:hidden;background:var(--bg2);border:1px solid var(--line2);cursor:pointer;transition:transform .3s}
.work:hover{transform:translateY(-4px)}
.work .media{position:relative;aspect-ratio:4/5;background:#000;overflow:hidden}
.work .media img,.work .media video{width:100%;height:100%;object-fit:cover}
.work .media video{position:absolute;inset:0;opacity:0;transition:opacity .35s}
.work.playing .media video{opacity:1}
.work .tag{position:absolute;left:12px;top:12px;font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff}
.work .play{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.work .play svg{width:13px;height:13px;fill:#fff;margin-left:2px}
.work .info{padding:13px 15px 15px}.work h3{font-size:15px;letter-spacing:-.02em;line-height:1.25;font-weight:600}
.work .m{margin-top:4px;font-size:13px;color:var(--mute)}
/* faq */
.faq{max-width:820px;margin:0 auto;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;font-size:clamp(18px,1.7vw,21px);font-weight:600;letter-spacing:-.02em}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:26px;color:var(--amber);transition:transform .3s;flex:none}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq .a{color:var(--mute);padding:0 0 22px;max-width:66ch}
/* formulario */
.nofor{max-width:640px;margin:0 auto 26px;text-align:center;color:var(--mute);font-size:15.5px}
.apply{max-width:680px;margin:0 auto;text-align:left;background:#fff;color:#181613;border-radius:26px;padding:clamp(22px,3.4vw,40px);box-shadow:0 40px 90px -50px rgba(24,22,19,.5)}
.ap-prog{display:grid;gap:10px;margin-bottom:22px;color:#514c46;font-size:14px}
.ap-prog .bar{height:5px;background:#ece8e2;border-radius:5px;overflow:hidden}
.ap-prog .bar i{display:block;height:100%;background:var(--amber);width:0;transition:width .35s}
.apply fieldset{border:0;margin:0 0 18px;min-width:0}
.apply legend,.apply .fld>label{display:block;font-size:clamp(18px,1.7vw,21px);font-weight:600;letter-spacing:-.02em;line-height:1.3;margin-bottom:12px;padding:0}
.apply .fld{margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt{display:block;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:block;padding:14px 18px;border:1.5px solid #ddd8d0;border-radius:14px;font-size:16px;line-height:1.4;transition:border-color .2s,background .2s}
.opt:hover span{border-color:#a39d94}
.opt input:checked+span{border-color:var(--amber);background:#fdf3e3}
.opt input:focus-visible+span{outline:2px solid #181613;outline-offset:2px}
.apply input[type=text],.apply input[type=email]{width:100%;padding:14px 16px;border:1.5px solid #ddd8d0;border-radius:14px;background:#fff;color:#181613;font:inherit;font-size:16px}
.apply input[type=text]:focus,.apply input[type=email]:focus{outline:2px solid #181613;outline-offset:1px}
.ap-nav{display:flex;gap:12px;justify-content:space-between;margin-top:6px}
.ap-nav [hidden]{display:none}
.ap-nav .btn-ghost{border-color:#ddd8d0;color:#181613}
.ap-err{background:#fde8e6;border-radius:12px;padding:10px 14px;font-size:14.5px;margin:0 0 14px}
.apply-done{max-width:680px;margin:0 auto;text-align:center;background:#fff;color:#181613;border-radius:26px;padding:clamp(28px,4vw,48px)}
.apply-done h3{font-size:clamp(26px,3vw,36px);margin-bottom:12px}
.apply-done p{color:#514c46;max-width:46ch;margin:0 auto 24px}
.apply-done .acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.apply-done .btn-ghost{border-color:#ddd8d0;color:#181613}
.call3{display:grid;gap:10px;max-width:680px;margin:26px auto 0;font-size:15.5px;color:var(--mute)}
@media(min-width:760px){.call3{grid-template-columns:repeat(3,1fr);text-align:center}}
.call3 b{display:block;color:var(--ink);font-weight:600}
/* pie y flotante */
.ftr{border-top:1px solid var(--line2);padding:34px 0;font-size:14px;color:var(--mute)}
.ftr .wrap{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center}
.ftr a{border-bottom:1px solid var(--line)}
.wa-float{position:fixed;right:18px;bottom:18px;z-index:60;width:54px;height:54px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 14px 34px -10px rgba(0,0,0,.6)}
.wa-float svg{width:28px;height:28px;fill:#fff}
dialog.lb{border:0;background:rgba(0,0,0,.92);width:100%;height:100%;max-width:none;max-height:none;padding:24px;color:#fff}
dialog.lb::backdrop{background:rgba(0,0,0,.9)}
.lb-close{position:absolute;right:20px;top:14px;font-size:34px;line-height:1;color:#fff;z-index:2}
.lb-in{height:100%;display:grid;place-items:center;gap:12px;align-content:center}
.lb-media video{max-height:78vh;max-width:92vw;border-radius:14px}
.lb-cap{text-align:center;font-size:15px;display:grid;gap:4px}.lb-cap a{color:var(--amber)}
/* reveal y movimiento reducido */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s ease}
.reveal.in{opacity:1;transform:none}
.static .reveal,.static .fade,.static .d,.static .cal .d{opacity:1;transform:none;transition:none}
.static .bars i{height:var(--h);transition:none}.static .row .bar i{width:var(--w);transition:none}
.static .ringbox .pr{stroke-dashoffset:0;transition:none}
.static *,.static *::before,.static *::after{animation:none!important}
.static .toast:first-child{opacity:1;transform:none}
.static .marquee{overflow-x:auto}.static .marquee .track{animation:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
<noscript><style>.fade,.reveal,.cal .d{opacity:1!important;transform:none!important}.bars i{height:var(--h)!important}.row .bar i{width:var(--w)!important}.ringbox .pr{stroke-dashoffset:0!important}</style></noscript>

 const targets=document.querySelectorAll('.reveal,.fade,.dash,#gar,#calPanel');
 if(reduce||!('IntersectionObserver' in window)){targets.forEach(e=>e.classList.add('in'));document.querySelectorAll('[data-count]').forEach(countUp);return}
 io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){const el=en.target;el.classList.add('in');el.querySelectorAll('[data-count]').forEach(c=>{if(!c.dataset.done){c.dataset.done=1;countUp(c)}});if(el.dataset&&el.dataset.count&&!el.dataset.done){el.dataset.done=1;countUp(el)}io.unobserve(el)}})},{threshold:.18});
 targets.forEach(e=>io.observe(e))}
applyI18n();render();observe();
/* respaldo: el contenido nunca se queda oculto aunque el observador no se dispare */
setTimeout(()=>document.querySelectorAll('.hero .fade').forEach(e=>e.classList.add('in')),500);
setTimeout(()=>{document.querySelectorAll('.reveal,.fade,.dash,#gar,#calPanel').forEach(e=>e.classList.add('in'));document.querySelectorAll('[data-count]').forEach(c=>{if(!c.dataset.done){c.dataset.done=1;countUp(c)}})},4500);
})();
</script>
