<style>
:root{
  --bg:#0c0b0a;--bg2:#141210;--bg3:#1b1917;--ink:#f6f5f4;--mute:#a39d94;--mute2:#8a847c;
  --line:rgba(246,245,244,.12);--line2:rgba(246,245,244,.06);
  --coral:#de6262;--amber:#e8a048;--gold:#f1b76f;--wine:#7a2a2a;
  --cream:#f5f3f0;--inkd:#1b1a18;--greyw:#514c46;--lined:rgba(27,26,24,.1);
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:var(--sans);
  --gutter:clamp(16px,4vw,56px);--max:1320px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img,video,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--coral);color:#fff}
.wrap{width:min(var(--max),100% - 2*var(--gutter));margin-inline:auto}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);display:inline-flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 4px rgba(222,98,98,.18);flex:none}
h1,h2,h3{font-weight:600;letter-spacing:-.035em;line-height:1.02}
h2{font-size:clamp(32px,4.6vw,62px)}
em{font-style:normal;font-weight:400;color:var(--gold)}
.lead{color:var(--mute);font-size:clamp(17px,1.4vw,20px);max-width:60ch;line-height:1.55}
.lead strong{color:var(--ink);font-weight:500}
.section{padding:clamp(64px,8vw,120px) 0;position:relative}
.sec-head{display:grid;gap:18px;margin-bottom:clamp(28px,4vw,48px)}
@media(min-width:900px){.sec-head{grid-template-columns:1.1fr .9fr;align-items:end}.sec-head .lead{justify-self:end;max-width:46ch}}
.sec-head h2{margin-top:16px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 24px;border-radius:999px;font-weight:500;font-size:15px;letter-spacing:-.01em;transition:transform .35s cubic-bezier(.2,.8,.2,1),background .3s,color .3s,box-shadow .3s;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none;fill:currentColor}
.btn-wa{background:linear-gradient(135deg,var(--coral),#c24a4a 60%,var(--wine));color:#fff;box-shadow:0 10px 40px -12px rgba(222,98,98,.7)}
.btn-wa:hover{transform:translateY(-2px);box-shadow:0 18px 50px -12px rgba(222,98,98,.85)}
.btn-ghost{border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{background:rgba(246,245,244,.06);transform:translateY(-2px)}
.light .btn-ghost{border-color:var(--lined);color:var(--inkd)}
.light .btn-ghost:hover{background:rgba(27,26,24,.05)}
.reassure{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--mute);margin-top:14px}
.qual{margin-top:18px;font-size:15px;color:var(--ink);border-left:2px solid var(--coral);padding-left:12px;max-width:52ch}

/* header */
.hdr{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .4s,backdrop-filter .4s,border-color .4s;border-bottom:1px solid transparent}
.hdr.scrolled{background:rgba(12,11,10,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line2)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:72px;gap:20px}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.04em;font-size:22px;font-family:"Inter",var(--sans)}
.logo svg{width:30px;height:30px}
.logo b{color:var(--coral)}
.nav{display:none;gap:28px;font-size:14px;color:var(--mute)}
.nav a{transition:color .25s}.nav a:hover{color:var(--ink)}
@media(min-width:960px){.nav{display:flex}}
.hdr-right{display:flex;align-items:center;gap:10px}
.lang{font-family:var(--mono);font-size:12px;letter-spacing:.1em;border:1px solid var(--line);border-radius:999px;padding:9px 12px;color:var(--mute);transition:.25s}
.lang:hover{color:var(--ink);border-color:var(--ink)}
.hdr .btn{padding:11px 18px;font-size:14px}
@media(max-width:560px){.hdr .btn{padding:10px 14px;font-size:13px}}
@media(max-width:400px){.hdr .btn-pri{display:none}}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;padding-top:110px}
.hero-media{position:absolute;inset:0;z-index:0}
.hero-media video,.hero-media img{width:100%;height:100%;object-fit:cover;opacity:.5;filter:blur(22px) saturate(1.25) brightness(.6);transform:scale(1.12)}
.hero-media::after{content:"";position:absolute;inset:0;background:
 radial-gradient(60% 55% at 85% 90%,rgba(222,98,98,.42),transparent 60%),
 radial-gradient(40% 40% at 10% 15%,rgba(232,160,72,.16),transparent 60%),
 linear-gradient(180deg,rgba(12,11,10,.6) 0%,rgba(12,11,10,.35) 45%,rgba(12,11,10,.96) 100%)}
.hero .wrap{position:relative;z-index:2;padding-bottom:clamp(24px,4vw,56px)}
.hero h1{font-size:clamp(38px,6vw,92px);max-width:17ch;margin:22px 0 24px}
.hero .lead{max-width:56ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hero-grid{display:grid;gap:28px}
@media(min-width:1000px){.hero-grid{grid-template-columns:1.35fr .65fr;align-items:end}}
.proof{display:grid;gap:12px;justify-self:end;width:100%;max-width:360px}
.proof-card{border:1px solid var(--line);background:rgba(20,18,16,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:22px;padding:22px 22px 20px;position:relative;overflow:hidden}
.proof-card::before{content:"";position:absolute;inset:auto -30% -50% auto;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(222,98,98,.35),transparent 65%);filter:blur(8px)}
.proof-card>*{position:relative}
.proof .k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.proof .row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:8px}
.proof .from{font-size:26px;font-weight:500;letter-spacing:-.03em;color:var(--mute)}
.proof .arrow{color:var(--coral);font-size:20px}
.proof .to{font-size:clamp(40px,3.6vw,54px);font-weight:600;letter-spacing:-.05em;line-height:1;color:var(--gold)}
.proof .who{font-size:14px;color:var(--mute);margin-top:8px}
.proof .who strong{color:var(--ink);font-weight:500}
.proof .proof-2{padding:16px 22px 18px}
.proof .v2{font-size:21px;font-weight:600;letter-spacing:-.03em;line-height:1.2;margin-top:6px}
.stats{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1100px){.stats{grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr))}}
.stat{border:1px solid var(--line2);background:var(--bg2);border-radius:22px;padding:24px;display:grid;gap:10px;align-content:start;position:relative;overflow:hidden;min-width:0}
.stat.hl{border-color:rgba(222,98,98,.45);box-shadow:0 40px 90px -40px rgba(222,98,98,.55)}
.stat .big{font-size:clamp(30px,3.4vw,52px);overflow-wrap:anywhere;font-weight:600;letter-spacing:-.05em;line-height:1;color:var(--gold)}
.stat .k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--coral)}
.stat p{font-size:15px;color:var(--mute);line-height:1.45}
.proof .mini{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.proof .mini .proof-card{padding:16px 18px}
.proof .mini .v{font-size:24px;font-weight:600;letter-spacing:-.04em;margin-top:4px}
.giant{position:relative;z-index:1;font-weight:700;font-family:"Inter",var(--sans);letter-spacing:-.06em;line-height:.78;font-size:clamp(96px,22vw,340px);color:rgba(246,245,244,.06);user-select:none;pointer-events:none;white-space:nowrap;margin-bottom:-.12em;margin-left:-.03em}
.giant b{color:rgba(222,98,98,.5)}

/* wall */
.wall{padding:clamp(48px,6vw,80px) 0;border-top:1px solid var(--line2)}
.wall .cap{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute2);text-align:center;margin-bottom:30px}
.faces{display:flex;flex-wrap:wrap;justify-content:center;gap:22px 18px}
.face{display:grid;justify-items:center;gap:8px;width:118px;text-align:center;text-decoration:none;color:inherit}
.face img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid rgba(246,245,244,.14);box-shadow:0 10px 30px -12px rgba(0,0,0,.8);transition:transform .5s cubic-bezier(.2,.8,.2,1),border-color .4s}
.face:hover img{transform:translateY(-4px) scale(1.04);border-color:var(--coral)}
.face .n{font-size:13px;font-weight:500;line-height:1.2}
.face .r{font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;color:var(--gold);line-height:1.3;word-break:break-all}
.face img{background:#1b1917}
.logos{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:26px 44px;margin-top:36px;padding-top:32px;border-top:1px solid var(--line2)}
.logos img{height:30px;width:auto;opacity:.78;transition:opacity .3s}
.logos img:hover{opacity:1}
.logos .wordmark{font-weight:600;letter-spacing:-.03em;font-size:22px;opacity:.85}
@media(max-width:600px){.logos{gap:20px 26px}.logos img{height:24px}.faces{gap:16px 8px}.face{width:calc(33.333% - 6px)}.face img{width:64px;height:64px}.face .n{font-size:12px}.face .r{font-size:9.5px}}

/* pains */
.pains{display:grid;gap:14px}
@media(min-width:760px){.pains{grid-template-columns:repeat(2,1fr)}}
.pain{border:1px solid var(--line2);background:var(--bg2);border-radius:22px;padding:24px 24px;display:grid;gap:10px;align-content:start}
.pain .x{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--coral)}
.pain h3{font-size:clamp(22px,2.1vw,27px);letter-spacing:-.03em;font-weight:600}
.pain p{color:var(--mute);font-size:15.5px;line-height:1.55}

/* tesis */
.tesis{display:grid;gap:18px;border-top:1px solid var(--line2);padding-top:clamp(40px,5vw,64px);margin-top:clamp(40px,5vw,64px)}
@media(min-width:900px){.tesis{grid-template-columns:1fr 1fr;gap:48px;align-items:start}}
.tesis h3{font-size:clamp(28px,3.4vw,46px);letter-spacing:-.04em;font-weight:600}
.tesis p{color:var(--mute);font-size:17px;line-height:1.6}
.tesis p strong{color:var(--ink);font-weight:500}

/* light sections */
.light{background:var(--cream);color:var(--inkd)}
.light .lead{color:var(--greyw)}.light .lead strong{color:var(--inkd)}
.light .eyebrow{color:#c24a4a}.light .eyebrow::before{background:#c24a4a;box-shadow:0 0 0 4px rgba(194,74,74,.15)}
.light .reassure{color:var(--greyw)}

/* comparison */
.cmp{display:grid;gap:14px}
@media(min-width:860px){.cmp{grid-template-columns:.9fr 1.1fr;align-items:stretch}}
.cmp ul{list-style:none}
.cmp li{display:flex;gap:12px;align-items:flex-start;padding:15px 0;border-top:1px solid var(--lined);font-size:15.5px;line-height:1.45}
.cmp li i{font-style:normal;font-family:var(--mono);flex:none;width:18px;text-align:center;transition:transform .3s}
.cmp-h{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;padding-bottom:14px}
.cmp-old{background:#fff;border:1px solid var(--lined);border-radius:24px;padding:24px 26px;color:var(--greyw)}
.cmp-old .cmp-h{color:var(--greyw)}
.cmp-old li i{color:#b9b2a8}
.cmp-new{position:relative;overflow:hidden;border-radius:24px;padding:24px 26px;background:var(--inkd);color:var(--ink);border:1px solid rgba(222,98,98,.45);box-shadow:0 40px 90px -40px rgba(222,98,98,.55),0 0 0 1px rgba(222,98,98,.08) inset}
.cmp-new::before{content:"";position:absolute;inset:auto -35% -55% auto;width:85%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(222,98,98,.55),rgba(232,160,72,.22) 40%,transparent 68%);filter:blur(12px);animation:breathe 4.5s ease-in-out infinite}
.cmp-new::after{content:"";position:absolute;inset:-40% auto auto -30%;width:60%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(232,160,72,.25),transparent 65%);filter:blur(14px);animation:breathe 6s ease-in-out infinite reverse}
.cmp-new .sweep{position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(246,245,244,.12) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 5.5s cubic-bezier(.6,0,.2,1) infinite;pointer-events:none}
.cmp-new>*{position:relative}
.cmp-new .cmp-h{display:flex;align-items:center;gap:10px;color:var(--ink);border-bottom:1px solid rgba(246,245,244,.12)}
.cmp-new .cmp-h svg{width:22px;height:22px}
.cmp-new .cmp-h span{font-family:"Inter",var(--sans);font-weight:700;font-size:18px;letter-spacing:-.04em;text-transform:none}
.cmp-new .cmp-h span b{color:var(--coral)}
.cmp-new .cmp-h em{margin-left:auto;font-style:normal;font-family:var(--mono);color:var(--gold)}
.cmp-new li{border-top-color:rgba(246,245,244,.1);color:var(--ink);font-weight:500;animation:rowin .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.12s * var(--i))}
.cmp-new li i{color:var(--coral);text-shadow:0 0 12px rgba(222,98,98,.8)}
.cmp-new li:hover{color:#fff}
.cmp-new li:hover i{transform:translateX(3px)}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.18);opacity:1}}
@keyframes sweep{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes rowin{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.cmp-new::before,.cmp-new::after,.cmp-new .sweep,.cmp-new li{animation:none}}

/* services */
.services{display:grid;gap:14px;margin-top:40px}
@media(min-width:900px){.services{grid-template-columns:repeat(3,1fr)}}
.service{background:#fff;border:1px solid var(--lined);border-radius:24px;padding:0 28px 30px;display:grid;gap:14px;align-content:start;overflow:hidden;transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s}
.vis{position:relative;height:230px;margin:0 -28px 14px;background:radial-gradient(80% 70% at 50% 110%,rgba(222,98,98,.22),transparent 70%),linear-gradient(180deg,#eceae5,#f5f3f0);border-bottom:1px solid var(--lined);overflow:hidden}
.vis .ph{position:absolute;left:50%;top:24px;transform:translateX(-50%);width:124px;aspect-ratio:9/16;border-radius:18px;overflow:hidden;border:4px solid #1b1a18;box-shadow:0 24px 50px -20px rgba(27,26,24,.6);background:#000}
.vis .ph img{width:100%;height:100%;object-fit:cover}
.vis .yt{position:absolute;left:28px;right:28px;top:26px;aspect-ratio:16/9;border-radius:14px;overflow:hidden;box-shadow:0 24px 50px -20px rgba(27,26,24,.6);background:#000}
.vis .yt img{width:100%;height:100%;object-fit:cover}
.vis .yt i{position:absolute;left:50%;top:50%;width:54px;height:36px;transform:translate(-50%,-50%);background:#ff0033;border-radius:10px}
.vis .yt i::after{content:"";position:absolute;left:55%;top:50%;transform:translate(-50%,-50%);border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
.vis .chip{position:absolute;background:#fff;color:var(--inkd);border-radius:999px;padding:9px 13px;font-size:12.5px;font-weight:500;box-shadow:0 14px 30px -14px rgba(27,26,24,.5);border:1px solid var(--lined);white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.vis .chip::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--coral);margin-right:8px;vertical-align:middle}
.vis .c1{left:18px;top:52px;animation:floaty 5s ease-in-out infinite}
.vis .c2{right:18px;bottom:36px;animation:floaty 6s ease-in-out infinite reverse}
.vis .c3{right:18px;bottom:22px;animation:floaty 6s ease-in-out infinite reverse}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){.vis .chip{animation:none}}
.service:hover{transform:translateY(-4px);box-shadow:0 30px 60px -30px rgba(27,26,24,.3)}
.service .num{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:#c24a4a}

.service .inc{color:var(--greyw);font-size:14.5px;line-height:1.55}
.service .inc span{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:4px;color:var(--inkd)}

/* work */
.showreel{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--line2);background:#000;aspect-ratio:16/9;margin-bottom:18px}
@media(min-width:900px){.showreel{aspect-ratio:21/9}}
.showreel video{width:100%;height:100%;object-fit:cover}
.showreel .lbl{position:absolute;left:16px;top:16px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:rgba(12,11,10,.55);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:#fff}
.grid-h{display:grid;gap:16px}

const L = o => (typeof o==='string') ? o : o[lang];
function cardHTML(w, extra){

  </article>`;
}
function imgHTML(p){
  const src=`assets/portfolio/${p.img}`, t=L(p.title);
  return `<article class="work" data-img="${src}" tabindex="0" role="button" aria-label="${esc(t)}">
    <div class="media"><img src="${src}" alt="${esc(t)}" loading="lazy" decoding="async"><span class="tag">${esc(L(p.type))}</span></div>
    <div class="info"><h3>${esc(t)}</h3><div class="m">${esc(p.client)}</div></div>
  </article>`;
}
function render(){
  document.getElementById('faces').innerHTML = FACES.map(f=>{

    return url?`<a class="face" href="${url}" target="_blank" rel="noopener">${inner}</a>`:`<div class="face">${inner}</div>`;
  }).join('');
  document.getElementById('mech').innerHTML = MECH.map(m=>`<div class="model reveal${m.hl?' hl':''}"><div class="k">${esc(L(m.k))}</div><h3>${esc(L(m.h))}</h3><p>${esc(L(m.p))}</p></div>`).join('');
  const card = (h,p,hl)=>`<div class="pain reveal"${hl?' style="border-color:rgba(222,98,98,.5)"':''}><h3>${esc(L(h))}</h3><p>${esc(L(p))}</p></div>`;

function openImage(src, alt){

function applyI18n(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent = tr(el.dataset.i18n)});
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{el.innerHTML = tr(el.dataset.i18nHtml)});
  document.getElementById('langBtn').textContent = lang==='es' ? 'EN' : 'ES';
  const wa = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(WA_TEXT[lang])}`;
  document.querySelectorAll('.wa-link').forEach(a=>a.href=wa);
  document.title = lang==='es' ? 'Acceler MKT · Dos o tres llamadas cualificadas más cada semana' : 'Acceler MKT · Two or three more qualified calls every week';

/* cards */
let activeMobile=null;
function bindCards(){
  document.querySelectorAll('.work').forEach(card=>{
    const v = card.querySelector('video');
    if(v && canHover){
      card.addEventListener('pointerenter', ()=>{ v.play().then(()=>card.classList.add('playing')).catch(()=>{}); });
      card.addEventListener('pointerleave', ()=>{ v.pause(); v.currentTime=0; card.classList.remove('playing'); });
    }
    const open = ()=> card.dataset.img ? openImage(card.dataset.img, card.getAttribute('aria-label')) : openLightbox(card.dataset.id);
    card.addEventListener('click', open);
    card.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();open()} });
  });
  if(!canHover && !reduce){
    const io = new IntersectionObserver(entries=>{
      entries.forEach(en=>{
        const card=en.target, v=card.querySelector('video'); if(!v) return;
        if(en.intersectionRatio>=.75){ if(activeMobile && activeMobile!==card){ activeMobile.querySelector('video').pause(); activeMobile.classList.remove('playing'); } activeMobile=card; v.play().then(()=>card.classList.add('playing')).catch(()=>{}); }
        else if(card===activeMobile){ v.pause(); card.classList.remove('playing'); activeMobile=null; }
      });
    },{threshold:[0,.75]});
    document.querySelectorAll('#pieces .work').forEach(c=>io.observe(c));
  }
}
const lb=document.getElementById('lb'), lbMedia=document.getElementById('lbMedia'), lbCap=document.getElementById('lbCap');
function openLightbox(id){
  const w = WORKS.find(x=>x.id===id); if(!w) return;
  document.querySelectorAll('.work video').forEach(v=>{v.pause()});
  lbMedia.innerHTML = `<video class="${w.r}" controls autoplay playsinline src="assets/videos/${w.id}.mp4" poster="assets/posters/${w.id}.jpg"></video>`;
  lbCap.innerHTML = `<strong>${esc(w.title[lang])}</strong><span>${esc(w.client)} · ${esc(w.type[lang])} · ${esc(w.dur)}</span>${w.yt?`<a href="https://www.youtube.com/watch?v=${w.yt}" target="_blank" rel="noopener">${tr('lb.yt')} ↗</a>`:''}`;
  if(typeof lb.showModal==='function') lb.showModal(); else lb.setAttribute('open','');
  if(window.lenis) window.lenis.stop();
  document.body.style.overflow='hidden';
}
function closeLightbox(){
  lbMedia.innerHTML='';
  if(lb.open) lb.close(); else lb.removeAttribute('open');
  if(window.lenis) window.lenis.start();
  document.body.style.overflow='';
}
document.getElementById('lbClose').addEventListener('click',closeLightbox);
lb.addEventListener('click',e=>{ if(e.target===lb) closeLightbox(); });
lb.addEventListener('close',()=>{ lbMedia.innerHTML=''; if(window.lenis) window.lenis.start(); document.body.style.overflow=''; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && lb.open) closeLightbox(); });

document.getElementById('langBtn').addEventListener('click',()=>{

function setupReveal(refresh){
  const els=[...document.querySelectorAll('.reveal:not(.in)')];
  if(reduce || !window.gsap){ els.forEach(e=>e.classList.add('in')); return; }
  els.forEach(el=>{
    gsap.fromTo(el,{opacity:0,y:28},{opacity:1,y:0,duration:1,ease:'power3.out',onStart:()=>el.classList.add('in'),
      scrollTrigger:{trigger:el,start:'top 88%',once:true}});
  });
  if(refresh && window.ScrollTrigger) ScrollTrigger.refresh();
}
function init(){
  applyI18n(); render();
  if(window.gsap){
    gsap.registerPlugin(ScrollTrigger, SplitText);
    if(!reduce && window.Lenis){
      const lenis = new Lenis({lerp:.09,smoothWheel:true});
      lenis.on('scroll',ScrollTrigger.update);
      gsap.ticker.add(time=>lenis.raf(time*1000));
      gsap.ticker.lagSmoothing(0);
      window.lenis=lenis;
      document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{ const id=a.getAttribute('href'); if(id.length>1 && document.querySelector(id)){ e.preventDefault(); lenis.scrollTo(id,{offset:-72}); } }));
    }
    if(!reduce){
      document.fonts.ready.then(()=>{
        const split = new SplitText('#heroTitle',{type:'lines',mask:'lines'});
        gsap.from(split.lines,{yPercent:110,duration:1.2,stagger:.09,ease:'power4.out',delay:.15});
        gsap.from('.hero .eyebrow',{opacity:0,y:10,duration:.8,delay:.1});
        gsap.from('.hero .lead, .strip, .hero-cta, .hero-sub',{opacity:0,y:20,duration:1,stagger:.1,delay:.55,ease:'power3.out'});
      });
    }
    setupReveal(false);
  } else { document.querySelectorAll('.reveal').forEach(e=>e.classList.add('in')); }
}
init();
})();
</script>
</body>
</html>
