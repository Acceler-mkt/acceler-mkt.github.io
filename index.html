<style>
:root{
  --bg:#080808;--card:#0f0f0f;--ink:#fff;--mute:rgba(255,255,255,.55);--mute2:rgba(255,255,255,.45);
  --amber:#e8a048;--gold:#f1b76f;--goldl:#ffd38a;--coral:#de6262;
  --line:rgba(232,160,72,.3);--line2:rgba(255,255,255,.08);
  --grad:linear-gradient(90deg,#ffd38a 0%,#f1b76f 30%,#e8a048 60%,#ffd38a 100%);
  --btn:linear-gradient(135deg,#f1b76f 0%,#e8a048 50%,#c97f2a 100%);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:16.8px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img,video,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.col{width:min(852px,100% - 40px);margin-inline:auto}
.wide{width:min(1140px,100% - 40px);margin-inline:auto}
.ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hl{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:sheen 6s linear infinite}
@keyframes sheen{to{background-position:200% 0}}
/* fondo: brillo dorado y partículas */
.glow{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.glow::before{content:"";position:absolute;left:50%;top:-140px;width:900px;height:700px;margin-left:-450px;border-radius:50%;background:radial-gradient(closest-side,rgba(232,160,72,.16),transparent);animation:breathe 7s ease-in-out infinite alternate}
@keyframes breathe{to{transform:scale(1.12);opacity:.75}}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:tw 3.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
/* cabecera */
.hdr{position:relative;z-index:5;border-bottom:1px solid var(--line2)}
.hdr .wide{display:flex;align-items:center;justify-content:center;height:66px;position:relative}
.logo{display:inline-flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.04em;font-size:19px}
.logo svg{width:26px;height:26px}.logo b{color:var(--coral)}
.lang{position:absolute;right:0;font-size:11px;font-weight:500;letter-spacing:.08em;border:1px solid var(--line2);border-radius:100px;padding:6px 11px;color:var(--mute)}
/* hero */
.hero{position:relative;text-align:center;padding:38px 0 10px}
.hero .col{position:relative;z-index:1}
.avs{display:inline-flex;align-items:center;gap:10px;padding:5px 14px 5px 6px;border:1px solid var(--line2);border-radius:100px;background:rgba(255,255,255,.03)}
.avs .st{display:flex}.avs img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid var(--bg);margin-left:-9px}.avs img:first-child{margin-left:0}
.avs span{text-align:left;line-height:1.25;font-size:10.5px;color:var(--mute)}.avs strong{display:block;font-size:11.5px;font-weight:600;color:#fff;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:10px;margin-top:16px;padding:9px 18px 9px 9px;border-radius:100px;border:1px solid rgba(232,160,72,.6);background:linear-gradient(90deg,rgba(232,160,72,.22),rgba(232,160,72,.1));font-size:14.5px;font-weight:500;line-height:1.3}
.pill i{width:24px;height:24px;border-radius:50%;background:var(--amber);color:#111;font-style:normal;font-weight:800;display:grid;place-items:center;flex:none;font-size:14px}
.pill b{color:var(--goldl);font-weight:800}
.hero h1{font-size:clamp(28px,3.2vw,46px);font-weight:600;line-height:1.02;letter-spacing:-.03em;max-width:720px;margin:20px auto 0}
.subg{margin-top:20px;font-size:13px;font-weight:400;letter-spacing:.04em;color:var(--amber)}
/* pieza principal (en lugar del VSL) */
.media{position:relative;margin:30px auto 0;border-radius:16px;border:1px solid var(--line);background:#0b0a09;box-shadow:0 0 0 1px rgba(232,160,72,.15),0 30px 90px -30px rgba(232,160,72,.45);overflow:hidden;text-align:left}
.m-top{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line2);font-size:12.5px;color:var(--mute)}
.m-top i{width:9px;height:9px;border-radius:50%;background:#2e2a26}.m-top i:first-child{background:var(--coral)}
.m-top b{margin-left:6px;color:#fff;font-weight:500}.m-top em{margin-left:auto;font-style:normal;font-size:10.5px;border:1px solid var(--line2);border-radius:100px;padding:2px 9px}
.m-body{display:grid;gap:14px;padding:18px}
@media(min-width:760px){.m-body{grid-template-columns:.85fr 1.15fr 1.25fr}}
.m-card{border:1px solid var(--line2);border-radius:12px;background:#121110;padding:16px}
.m-card small{display:block;font-size:11px;color:var(--mute2);margin-bottom:8px;font-weight:400}
.m-num{font-size:62px;font-weight:700;letter-spacing:-.05em;line-height:1}
.m-delta{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:500;color:#7bd88f;background:rgba(123,216,143,.12);border-radius:100px;padding:2px 9px}
.bars{display:flex;align-items:flex-end;gap:7px;height:112px}
.bars i{flex:1;border-radius:6px 6px 2px 2px;background:var(--btn);height:0;transition:height 1s cubic-bezier(.2,.8,.2,1)}
.in .bars i{height:var(--h)}
.bars-l{display:flex;gap:7px;margin-top:7px;font-size:10.5px;color:var(--mute2)}.bars-l span{flex:1;text-align:center}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.1fr) 18px;gap:9px;align-items:center;font-size:12px;color:var(--mute)}
.row .bar{height:7px;background:#25221f;border-radius:7px;overflow:hidden}
.row .bar i{display:block;height:100%;width:0;background:var(--amber);border-radius:7px;transition:width 1.2s cubic-bezier(.2,.8,.2,1) .3s}
.in .row .bar i{width:var(--w)}
.row b{color:#fff;text-align:right;font-weight:600}
.toasts{position:absolute;right:16px;bottom:14px;width:min(260px,calc(100% - 32px));height:44px;pointer-events:none}
.toast{position:absolute;inset:0;display:flex;align-items:center;gap:9px;padding:0 13px;border-radius:12px;background:#fff;color:#111;font-size:12.5px;font-weight:500;box-shadow:0 18px 40px -16px rgba(0,0,0,.8);opacity:0;transform:translateY(12px);animation:toast 9s infinite}
.toast:nth-child(2){animation-delay:3s}.toast:nth-child(3){animation-delay:6s}
.toast .dot{width:8px;height:8px;border-radius:50%;background:#2fb457;flex:none}
@keyframes toast{0%{opacity:0;transform:translateY(12px)}6%,28%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-8px)}}
@media(max-width:759px){.toasts{position:relative;right:auto;bottom:auto;margin:0 18px 16px;width:auto}}
.m-cap{margin-top:10px;font-size:11px;color:var(--mute2);text-align:center}
/* botón como GrowthMastery */
.cta{display:flex;flex-direction:column;align-items:center;margin-top:26px}
.btn{display:inline-flex;flex-direction:column;align-items:center;gap:4px;padding:18px 46px 16px;border-radius:14px;background:var(--btn);color:#111;box-shadow:0 0 0 1px rgba(232,160,72,.4),0 4px 24px rgba(232,160,72,.35);transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(232,160,72,.6),0 10px 34px rgba(232,160,72,.5)}
.btn strong{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1}
.btn small{font-size:10.5px;font-weight:500;letter-spacing:.06em;opacity:.75}
.note{margin-top:12px;font-size:11.5px;color:var(--mute2);max-width:480px}
/* logos */
.logos-lab{padding:36px 0 12px;text-align:center;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute2)}
.lmarq{overflow:hidden;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:18px 0;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.lmarq .tr{display:flex;align-items:center;gap:64px;width:max-content;animation:marq 30s linear infinite}
.lmarq img{height:26px;width:auto;filter:brightness(0) invert(1);opacity:.6}
.lmarq .wm{font-size:20px;font-weight:600;letter-spacing:-.03em;opacity:.6;white-space:nowrap}
.lmarq .fc{display:flex;align-items:center;gap:10px;opacity:.75;font-size:14px;font-weight:500;white-space:nowrap}
.lmarq .fc img{filter:none;opacity:1;height:30px;width:30px;border-radius:50%;object-fit:cover}
@keyframes marq{to{transform:translateX(-50%)}}
/* secciones */
.sec{position:relative;padding:44px 0 8px}
.lab{font-size:11px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.ttl{margin-top:12px;font-size:clamp(22px,2.2vw,28px);font-weight:500;line-height:1.2;letter-spacing:-.02em;max-width:640px}
.ttl+.bar-g{width:56px;height:3px;border-radius:3px;background:var(--btn);margin-top:16px}
.shead{margin-bottom:26px}
.shead.c{text-align:center}.shead.c .ttl{margin-inline:auto}.shead.c .bar-g{margin-inline:auto}
.shead p{margin-top:8px;font-size:13px;color:var(--mute2)}
/* formulario en tarjeta blanca (como el calendario embebido) */
.apply{background:#fff;color:#111;border-radius:16px;padding:clamp(22px,3vw,34px);text-align:left;box-shadow:0 30px 80px -40px rgba(232,160,72,.4)}
.ap-prog{display:grid;gap:9px;margin-bottom:20px;color:#666;font-size:13px;font-weight:400}
.ap-prog .bar{height:4px;background:#eee;border-radius:4px;overflow:hidden}
.ap-prog .bar i{display:block;height:100%;background:var(--amber);width:0;transition:width .35s}
.apply fieldset{border:0;margin:0 0 16px;min-width:0}
.apply legend,.apply .fld>label{display:block;font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.3;margin-bottom:12px;padding:0}
.apply .fld{margin-bottom:16px}
.opts{display:grid;gap:9px}
.opt{display:block;cursor:pointer}.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:block;padding:13px 16px;border:1.5px solid #e4e0da;border-radius:12px;font-size:15.5px;font-weight:400;transition:border-color .2s,background .2s}
.opt:hover span{border-color:#aaa}.opt input:checked+span{border-color:var(--amber);background:#fdf3e3}
.opt input:focus-visible+span{outline:2px solid #111;outline-offset:2px}
.apply input[type=text],.apply input[type=email]{width:100%;padding:13px 15px;border:1.5px solid #e4e0da;border-radius:12px;background:#fff;color:#111;font:inherit;font-size:16px;font-weight:400}
.apply input:focus{outline:2px solid #111;outline-offset:1px}
.ap-nav{display:flex;gap:10px;justify-content:space-between;margin-top:6px}
.ap-nav [hidden]{display:none}
.b-ghost{padding:13px 22px;border-radius:12px;border:1.5px solid #e4e0da;font-weight:500;font-size:15px}
.b-go{padding:13px 26px;border-radius:12px;background:var(--btn);color:#111;font-weight:700;font-size:15px}
.ap-err{background:#fde8e6;border-radius:10px;padding:9px 13px;font-size:14px;margin:0 0 12px}
.apply-done{background:#fff;color:#111;border-radius:16px;padding:clamp(26px,4vw,44px);text-align:center}
.apply-done h3{font-size:clamp(24px,3vw,32px);font-weight:700;letter-spacing:-.03em;margin-bottom:10px}
.apply-done p{color:#555;max-width:44ch;margin:0 auto 22px}
.apply-done .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.apply-done .b-ghost{display:inline-flex;align-items:center;gap:8px}.apply-done svg{width:16px;height:16px;fill:currentColor}
/* tarjetas tipo GrowthMastery */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:left}
.card h3{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.card .role{font-size:11px;font-weight:500;color:var(--amber);margin-top:2px}
.card p{font-size:13px;color:var(--mute2);margin-top:10px;line-height:1.55}
.card p b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
/* flujo */
.flow{display:grid;gap:12px}
@media(min-width:860px){.flow{grid-template-columns:repeat(5,1fr);gap:0}}
.fn{position:relative;text-align:center;padding:4px 8px}
.fn .c{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--gold);display:grid;place-items:center;font-size:26px;position:relative;z-index:1}
.fn.last .c{background:var(--btn);color:#111;border:0}
.fn b{display:block;font-size:14px;font-weight:600}
.fn small{display:block;font-size:11.5px;color:var(--mute2);margin-top:3px;line-height:1.4}
@media(min-width:860px){.fn:not(:last-child)::after{content:"";position:absolute;top:36px;left:calc(50% + 36px);width:calc(100% - 72px);border-top:1px dashed rgba(232,160,72,.4)}
.fn:not(:last-child)::before{content:"";position:absolute;top:32px;left:calc(50% + 36px);width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);z-index:2;animation:flow 2.6s linear infinite}
.fn:nth-child(2)::before{animation-delay:.6s}.fn:nth-child(3)::before{animation-delay:1.2s}.fn:nth-child(4)::before{animation-delay:1.8s}}
@keyframes flow{0%{transform:translateX(0);opacity:0}15%,85%{opacity:1}100%{transform:translateX(120px);opacity:0}}
.flow-note{text-align:center;margin-top:18px;font-size:13px;color:var(--mute2)}.flow-note b{color:#fff;font-weight:600}
/* cerebro y volumen */
.two{display:grid;gap:14px}
@media(min-width:800px){.two{grid-template-columns:1fr 1fr}}
.orb{position:relative;height:210px;margin-top:14px}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:104px;height:104px;border-radius:50%;background:var(--btn);color:#111;display:grid;place-items:center;text-align:center;font-weight:700;font-size:13px;line-height:1.15;z-index:2}
.core::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(232,160,72,.55);animation:ring 2.6s ease-out infinite}
@keyframes ring{from{transform:scale(.86);opacity:1}to{transform:scale(1.4);opacity:0}}
.chipx{position:absolute;padding:6px 12px;border-radius:100px;background:#181614;border:1px solid var(--line);font-size:12.5px;font-weight:400;white-space:nowrap;animation:bob 5s ease-in-out infinite alternate}
.chipx:nth-child(2){left:0;top:8%}.chipx:nth-child(3){right:0;top:14%;animation-delay:-1s}.chipx:nth-child(4){left:3%;bottom:8%;animation-delay:-2s}.chipx:nth-child(5){right:3%;bottom:6%;animation-delay:-3s}.chipx:nth-child(6){left:50%;top:-4%;margin-left:-48px;animation-delay:-1.5s}
@keyframes bob{to{transform:translateY(-6px)}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.cal .d{aspect-ratio:1;border-radius:7px;background:#1c1916;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;opacity:0;transform:scale(.7);transition:opacity .35s,transform .35s;transition-delay:calc(var(--i)*26ms)}
.in .cal .d{opacity:1;transform:none}
.cal .d b,.cal .d u{width:7px;height:7px;border-radius:50%;display:block}.cal .d b{background:var(--coral)}.cal .d u{background:var(--gold)}
.legend{display:flex;gap:16px;margin-top:10px;font-size:11.5px;color:var(--mute2)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}.legend .a::before{background:var(--coral)}.legend .c::before{background:var(--gold)}
/* garantía */
.gcard{display:grid;gap:22px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(22px,3vw,36px)}
@media(min-width:760px){.gcard{grid-template-columns:auto 1fr;gap:36px}}
.gbig{text-align:center}
.gbig b{display:block;font-size:84px;font-weight:800;letter-spacing:-.06em;line-height:.9}
.gbig span{display:block;font-size:12px;color:var(--mute);margin-top:6px;max-width:140px}
.gcard h3{font-size:22px;font-weight:600;letter-spacing:-.02em}
.gcard p{font-size:14.5px;color:var(--mute);margin-top:10px}
.gcard p strong{color:#fff;font-weight:600}
.gcard .def{font-size:12.5px;color:var(--mute2)}
/* resultados */
.res{display:grid;gap:14px}
@media(min-width:760px){.res{grid-template-columns:1fr 1fr}}
.res .card .big{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:14px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.res .card .who{display:flex;align-items:center;gap:12px}
.res .card .who img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.res .card .who .ini{width:44px;height:44px;border-radius:50%;background:#1c1916;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--gold)}
.wmarq{margin-top:18px;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.wmarq .tr{display:flex;gap:12px;width:max-content;animation:marq 46s linear infinite}
.wmarq:hover .tr{animation-play-state:paused}
.wmarq img{height:clamp(180px,20vw,250px);width:auto;border-radius:12px;border:1px solid var(--line2)}
/* faq */
.faq{border-top:1px solid var(--line2)}
.faq details{border-bottom:1px solid var(--line2)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:18px 0;font-size:16px;font-weight:500;letter-spacing:-.01em}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:22px;color:var(--amber);transition:transform .3s;flex:none}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq .a{font-size:14px;color:var(--mute);padding:0 0 18px}
/* cierre y pie */
.final{text-align:center;padding:56px 0 64px}

let lang=(new URLSearchParams(location.search).get('lang')||(function(){try{return localStorage.getItem('lang')}catch(e){return null}})()||'es'); if(!I18N[lang]) lang='es';
const tr=k=>(I18N[lang][k]??I18N.es[k]??k);
const L=o=>(typeof o==='string')?o:o[lang];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches||new URLSearchParams(location.search).has('static');
if(reduce) document.documentElement.classList.add('static');
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function applyI18n(){
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=tr(el.dataset.i18n)});
 document.querySelectorAll('[data-i18n-html]').forEach(el=>{el.innerHTML=tr(el.dataset.i18nHtml)});
 $('#langBtn').textContent=lang==='es'?'EN':'ES';
 const wa='https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(WA_TEXT[lang]);
 document.querySelectorAll('.wa-link').forEach(a=>a.href=wa);
 document.title=lang==='es'?'Acceler MKT · 16 llamadas cualificadas al mes, garantizadas por contrato':'Acceler MKT · 16 qualified calls a month, guaranteed in the contract';
}
function render(){
 $('#heroFaces').innerHTML=FACES.slice(0,4).map(f=>`<img src="assets/img/${f.img}" alt="${esc(f.n)}">`).join('');
 const l=LOGOS.join('');$('#lmarq').innerHTML=l+l+l+l;
 const w=WORK.map(p=>`<img src="assets/portfolio/${p}" alt="" loading="lazy">`).join('');$('#wmarq').innerHTML=w+w;
 $('#faqList').innerHTML=FAQ.map(f=>`<details><summary>${esc(L(f.q))}</summary><div class="a">${esc(L(f.a))}</div></details>`).join('');
 const cal=$('#cal');if(cal&&!cal.children.length){let h='';for(let i=0;i<35;i++)h+=`<div class="d" style="--i:${i}"><b></b><u></u></div>`;cal.innerHTML=h}
 renderApply();
}
const AP={step:0,data:{}};
function optLabel(f,v){const o=(f.o||[]).find(x=>x.v===v);return o?o[lang]:(v||'')}
function fieldHTML(f){const q=esc(L(f.q));
 if(f.k==='radio'){const cur=AP.data[f.n];const opts=f.o.map(o=>`<label class="opt"><input type="radio" name="${f.n}" value="${esc(o.v)}"${cur===o.v?' checked':''}><span>${esc(o[lang])}</span></label>`).join('');
  const other=(f.other&&cur==='d')?`<div class="fld" style="margin-top:12px"><input type="text" name="${f.n}_otro" value="${esc(AP.data[f.n+'_otro']||'')}" aria-label="${q}"></div>`:'';
  return `<fieldset><legend>${q}</legend><div class="opts">${opts}</div>${other}</fieldset>`}
 return `<div class="fld"><label for="f_${f.n}">${q}</label><input id="f_${f.n}" type="${f.k==='email'?'email':'text'}" name="${f.n}" value="${esc(AP.data[f.n]||'')}" autocomplete="${f.n==='email'?'email':(f.n==='nombre'?'given-name':'off')}"></div>`}
function renderApply(){const fields=APPLY[AP.step],tot=APPLY.length;
 $('#apStep').textContent=tr('a.step').replace('{n}',AP.step+1).replace('{t}',tot);$('#apBar').style.width=((AP.step+1)/tot*100)+'%';
 $('#apBody').innerHTML=fields.map(fieldHTML).join('');$('#apBack').textContent=tr('a.back');$('#apBack').hidden=AP.step===0;
 $('#apNext').textContent=AP.step===tot-1?tr('a.send'):tr('a.next');
 $('#apBody').querySelectorAll('input').forEach(inp=>{const h=()=>{AP.data[inp.name]=inp.value;if(inp.type==='radio'&&inp.name==='bloqueo')renderApply()};inp.addEventListener('input',h);inp.addEventListener('change',()=>{if(inp.type==='radio')h()})})}
function validate(){const err=$('#apErr');err.innerHTML='';
 for(const f of APPLY[AP.step]){const v=AP.data[f.n];const need=f.k==='radio'||f.req;
  if(need&&(!v||!String(v).trim())){err.innerHTML=`<p class="ap-err" role="alert">${esc(tr('a.err'))}</p>`;return false}
  if(f.k==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){err.innerHTML=`<p class="ap-err" role="alert">${esc(tr('a.errEmail'))}</p>`;return false}}
 return true}
function summary(){const flat=APPLY.flat(),d=AP.data,g=n=>flat.find(f=>f.n===n),lab=n=>optLabel(g(n),d[n]);const bl=d.bloqueo==='d'&&d.bloqueo_otro?d.bloqueo_otro:lab('bloqueo');
 return lang==='es'?`Hola Alfonso, soy ${d.nombre}. Acabo de rellenar el formulario. Me frena: ${bl}. Vendo: ${d.vende} (${lab('ticket')}). Vendo con: ${lab('quien')}, ${lab('llamadas')} llamadas reservadas a la semana. Anuncios al mes: ${lab('anuncios')}. ¿Puedo asumir la inversión?: ${lab('precio')}. Decide: ${lab('decide')}.`
 :`Hi Alfonso, I'm ${d.nombre}. I just filled in the form. What holds me back: ${bl}. I sell: ${d.vende} (${lab('ticket')}). I sell with: ${lab('quien')}, ${lab('llamadas')} booked calls a week. Monthly ad spend: ${lab('anuncios')}. Can I take on the investment?: ${lab('precio')}. Decision: ${lab('decide')}.`}
function finish(){if(FORM_ENDPOINT){try{fetch(FORM_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({lang,source:'web-v7'},AP.data))}).catch(()=>{})}catch(e){}}
 $('#apWa').href='https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(summary());$('#apCal').href=CAL_URL;
 $('#applyForm').hidden=true;$('#apDone').hidden=false;applyI18n();$('#apDone').scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'})}
$('#apNext').addEventListener('click',()=>{if(!validate())return;if(AP.step===APPLY.length-1){finish();return}AP.step++;renderApply();const f=$('#apBody input');if(f&&f.type!=='radio')f.focus()});
$('#apBack').addEventListener('click',()=>{if(AP.step>0){AP.step--;$('#apErr').innerHTML='';renderApply()}});
$('#langBtn').addEventListener('click',()=>{lang=lang==='es'?'en':'es';try{localStorage.setItem('lang',lang)}catch(e){}applyI18n();render();observe()});
function countUp(el){const to=+el.dataset.count,dur=1300;if(reduce){el.textContent=to;return}const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e);if(p<1)requestAnimationFrame(f)})(t0)}
let io;
function observe(){if(io)io.disconnect();const targets=document.querySelectorAll('.rv,#calPanel');
 if(reduce||!('IntersectionObserver' in window)){targets.forEach(e=>e.classList.add('in'));document.querySelectorAll('[data-count]').forEach(countUp);return}
 io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){const el=en.target;el.classList.add('in');el.querySelectorAll('[data-count]').forEach(c=>{if(!c.dataset.done){c.dataset.done=1;countUp(c)}});if(el.dataset.count&&!el.dataset.done){el.dataset.done=1;countUp(el)}io.unobserve(el)}})},{threshold:.15});
 targets.forEach(e=>io.observe(e))}
applyI18n();render();observe();
setTimeout(()=>document.querySelectorAll('.hero .rv').forEach(e=>e.classList.add('in')),400);
setTimeout(()=>{document.querySelectorAll('.rv,#calPanel').forEach(e=>e.classList.add('in'));document.querySelectorAll('[data-count]').forEach(c=>{if(!c.dataset.done){c.dataset.done=1;countUp(c)}})},4500);
})();
</script>
